# Run Procyon's tests (tests/run_tests.py) on one of GitHub's Linux machines
# every time code is pushed, so a change that breaks something shows up as a
# red cross on GitHub straight away. The tests need no radio, sound card or
# WSJT-X - only Python with numpy and aiohttp, like Procyon itself.
#
# "Run workflow" on the Actions tab runs them by hand too.

name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.10", "3.12"]   # the oldest Procyon supports, and the one in the Windows build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install what Procyon uses
        run: python -m pip install numpy aiohttp
      - name: Run the tests
        run: python tests/run_tests.py
