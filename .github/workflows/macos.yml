# Build the macOS app (.dmg and .pkg) on one of GitHub's Macs, so a Mac release
# no longer needs someone to build it by hand.
#
# - Publishing a GitHub release builds that release's code and attaches the
#   .dmg, .pkg and SHA256SUMS-macos to it.
# - "Run workflow" on the Actions tab builds the current main branch; the files
#   are then under the run's "Artifacts" (kept 14 days).
#
# The app is ad-hoc signed (no Apple Developer ID), so the first launch on a
# Mac needs System Settings > Privacy & Security > Open Anyway.

name: macOS build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write   # to attach the files to the release

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # build.sh uses this Python only to download the packages for the app;
      # the app itself bundles python.org's Python.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build Procyon.app, .dmg and .pkg
        run: packaging/macos/build.sh

      - name: Checksums
        run: cd dist && shasum -a 256 Procyon-*-macos.dmg Procyon-*-macos.pkg | tee SHA256SUMS-macos

      - uses: actions/upload-artifact@v4
        with:
          name: procyon-macos
          path: |
            dist/Procyon-*-macos.dmg
            dist/Procyon-*-macos.pkg
            dist/SHA256SUMS-macos
          retention-days: 14

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}" --clobber
          dist/Procyon-*-macos.dmg dist/Procyon-*-macos.pkg dist/SHA256SUMS-macos
