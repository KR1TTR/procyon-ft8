<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Procyon · Sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E    %3Cdefs%3E    %3CradialGradient id=%22glow%22 cx=%2250%25%22 cy=%2250%25%22 r=%2250%25%22%3E      %3Cstop offset=%220%22 stop-color=%22%23fff6d6%22 stop-opacity=%22.9%22/%3E      %3Cstop offset=%221%22 stop-color=%22%23fff6d6%22 stop-opacity=%220%22/%3E    %3C/radialGradient%3E  %3C/defs%3E    %3Cpath d=%22M4.2 13.2 5.6 3.6 13 8.4Z%22 fill=%22%23aab6cc%22/%3E  %3Cpath d=%22M27.8 13.2 26.4 3.6 19 8.4Z%22 fill=%22%23aab6cc%22/%3E  %3Cpath d=%22M6.2 10.6 7 6.2 10.6 8.6Z%22 fill=%22%23141b2e%22/%3E  %3Cpath d=%22M25.8 10.6 25 6.2 21.4 8.6Z%22 fill=%22%23141b2e%22/%3E    %3Cpath d=%22M16 6.6c6.6 0 11.7 3.7 12.6 8.9.7 4-2.1 6.6-5.6 8.7l-5.4 4.6a2.4 2.4 0 0 1-3.2 0L9 24.2c-3.5-2.1-6.3-4.7-5.6-8.7C4.3 10.3 9.4 6.6 16 6.6Z%22 fill=%22%23c9d3e6%22/%3E        %3Cpath d=%22M3.6 16.1c2.1-3.7 6.9-4.2 10-1.3L16 17l2.4-2.2c3.1-2.9 7.9-2.4 10 1.3-1.6 3.6-6.2 4.7-9.3 3.1L16 20.7l-3.1-1.5c-3.1 1.6-7.7.5-9.3-3.1Z%22 fill=%22%230b1020%22/%3E    %3Cpath d=%22M11.6 21.2Q16 19.4 20.4 21.2l-2.6 6.5a2.4 2.4 0 0 1-3.6 0Z%22 fill=%22%23eef2f8%22/%3E  %3Cellipse cx=%2216%22 cy=%2226.4%22 rx=%221.6%22 ry=%221.1%22 fill=%22%230b1020%22/%3E    %3Ccircle cx=%229.6%22 cy=%2216.3%22 r=%223.2%22 fill=%22url%28%23glow%29%22/%3E  %3Ccircle cx=%2222.4%22 cy=%2216.3%22 r=%223.2%22 fill=%22url%28%23glow%29%22/%3E  %3Cpath d=%22M9.6 12.9 10.5 15.4 13 16.3 10.5 17.2 9.6 19.7 8.7 17.2 6.2 16.3 8.7 15.4Z%22 fill=%22%23fff4c2%22/%3E  %3Cpath d=%22M22.4 12.9 23.3 15.4 25.8 16.3 23.3 17.2 22.4 19.7 21.5 17.2 19 16.3 21.5 15.4Z%22 fill=%22%23fff4c2%22/%3E%3C/svg%3E">
<style>
  :root { --bg: #080c17; --surface: #111829; --surface2: #172036; --border: #212b45; --text: #e7ecf6;
          --muted: #8592b0; --faint: #56617f; --rx: #3dd6c4; --tx: #ff5b6e; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(900px 500px at 20% -10%, #13204a55, transparent), var(--bg);
    color: var(--text); font: 15px/1.4 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid; place-items: center; padding: 16px; -webkit-font-smoothing: antialiased;
    user-select: none; -webkit-user-select: none;
  }
  .card { width: min(340px, 100%); text-align: center; }
  .brand { display: flex; align-items: center; justify-content: center; gap: 9px; font-weight: 700; font-size: 20px; }
  .brand svg { width: 30px; height: 30px; }
  .brand small { font: 600 11px ui-monospace, monospace; color: var(--bg); background: var(--rx); padding: 2px 6px; border-radius: 4px; }
  p { color: var(--muted); margin: 10px 0 24px; font-size: 14px; }
  .dots { display: flex; justify-content: center; gap: 12px; height: 18px; margin-bottom: 10px; }
  .dots span { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--faint); transition: .15s; }
  .dots span.on { background: var(--rx); border-color: var(--rx); }
  .dots.bad span { border-color: var(--tx); background: none; animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
  .msg { min-height: 20px; font-size: 13px; color: var(--tx); margin-bottom: 14px; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .pad button {
    height: 64px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font: 600 24px ui-monospace, "SF Mono", monospace; cursor: pointer;
    touch-action: manipulation; transition: background .1s;
  }
  .pad button:active { background: var(--surface2); }
  .pad button.fn { font: 600 15px Inter, system-ui, sans-serif; color: var(--muted); }
  .pad button.go { background: var(--rx); border-color: var(--rx); color: #04121a; }
  .pad button:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true"><defs><radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff6d6" stop-opacity=".9"/><stop offset="1" stop-color="#fff6d6" stop-opacity="0"/></radialGradient></defs><path d="M4.2 13.2 5.6 3.6 13 8.4Z" fill="#aab6cc"/><path d="M27.8 13.2 26.4 3.6 19 8.4Z" fill="#aab6cc"/><path d="M6.2 10.6 7 6.2 10.6 8.6Z" fill="#141b2e"/><path d="M25.8 10.6 25 6.2 21.4 8.6Z" fill="#141b2e"/><path d="M16 6.6c6.6 0 11.7 3.7 12.6 8.9.7 4-2.1 6.6-5.6 8.7l-5.4 4.6a2.4 2.4 0 0 1-3.2 0L9 24.2c-3.5-2.1-6.3-4.7-5.6-8.7C4.3 10.3 9.4 6.6 16 6.6Z" fill="#c9d3e6"/><path d="M3.6 16.1c2.1-3.7 6.9-4.2 10-1.3L16 17l2.4-2.2c3.1-2.9 7.9-2.4 10 1.3-1.6 3.6-6.2 4.7-9.3 3.1L16 20.7l-3.1-1.5c-3.1 1.6-7.7.5-9.3-3.1Z" fill="#0b1020"/><path d="M11.6 21.2Q16 19.4 20.4 21.2l-2.6 6.5a2.4 2.4 0 0 1-3.6 0Z" fill="#eef2f8"/><ellipse cx="16" cy="26.4" rx="1.6" ry="1.1" fill="#0b1020"/><circle cx="9.6" cy="16.3" r="3.2" fill="url(#glow)"/><circle cx="22.4" cy="16.3" r="3.2" fill="url(#glow)"/><path d="M9.6 12.9 10.5 15.4 13 16.3 10.5 17.2 9.6 19.7 8.7 17.2 6.2 16.3 8.7 15.4Z" fill="#fff4c2"/><path d="M22.4 12.9 23.3 15.4 25.8 16.3 23.3 17.2 22.4 19.7 21.5 17.2 19 16.3 21.5 15.4Z" fill="#fff4c2"/></svg>
    Procyon <small>FT8</small>
  </div>
  <p>Enter the station PIN to continue.</p>
  <div class="dots" id="dots" aria-live="polite"></div>
  <div class="msg" id="msg" role="alert"></div>
  <div class="pad" id="pad">
    <button>1</button><button>2</button><button>3</button>
    <button>4</button><button>5</button><button>6</button>
    <button>7</button><button>8</button><button>9</button>
    <button class="fn" data-k="del" aria-label="Delete">⌫</button><button>0</button>
    <button class="fn go" data-k="go" aria-label="Sign in">→</button>
  </div>
</main>
<script>
  "use strict";
  let pin = "", lockTimer = null;
  const dots = document.getElementById("dots"), msg = document.getElementById("msg");

  function draw() {
    const n = Math.max(4, pin.length);
    dots.innerHTML = Array.from({ length: n }, (_, i) => `<span class="${i < pin.length ? "on" : ""}"></span>`).join("");
  }
  function press(k) {
    if (lockTimer) return;
    if (k === "del") pin = pin.slice(0, -1);
    else if (k === "go") return submit();
    else if (pin.length < 8) pin += k;
    msg.textContent = "";
    dots.classList.remove("bad");
    draw();
  }
  function lock(sec) {
    const btns = document.querySelectorAll("#pad button");
    btns.forEach((b) => { b.disabled = true; });
    const tick = () => {
      if (sec <= 0) {
        clearInterval(lockTimer); lockTimer = null;
        btns.forEach((b) => { b.disabled = false; });
        msg.textContent = "";
        return;
      }
      msg.textContent = `Too many wrong PINs. Try again in ${sec--} s.`;
    };
    tick();
    lockTimer = setInterval(tick, 1000);
  }
  async function submit() {
    if (pin.length < 4) { msg.textContent = "The PIN is at least 4 digits."; return; }
    let r;
    try {
      r = await fetch("/login", { method: "POST", headers: { "Content-Type": "application/json" },
                                  body: JSON.stringify({ pin }) });
    } catch { msg.textContent = "Can't reach Procyon. Is it still running?"; return; }
    if (r.status === 403) { msg.textContent = "Remote access is switched off on the station computer."; return; }
    const res = await r.json().catch(() => ({}));
    if (res.ok) { location.replace("/"); return; }
    pin = ""; draw();
    dots.classList.add("bad");
    if (res.wait) lock(res.wait);
    else msg.textContent = res.left ? `Wrong PIN. ${res.left} ${res.left === 1 ? "try" : "tries"} left before a short lockout.` : "Wrong PIN.";
  }

  document.getElementById("pad").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (b) press(b.dataset.k || b.textContent);
  });
  document.addEventListener("keydown", (e) => {
    if (/^\d$/.test(e.key)) press(e.key);
    else if (e.key === "Backspace") press("del");
    else if (e.key === "Enter") press("go");
  });
  draw();
</script>
</body>
</html>
